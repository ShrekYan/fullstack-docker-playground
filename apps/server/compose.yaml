name: server

services:
  # 开发模式：cd apps/server && docker compose --profile dev up
  server-dev:
    profiles: [dev]
    environment:
      TZ: Asia/Shanghai
    build:
      # context 必须是仓库根（pnpm workspace 需要）
      context: ../..
      dockerfile: apps/server/Dockerfile.dev
    command: pnpm --filter ./apps/server dev
    ports:
      - "3000:3000"
    volumes:
      # 相对路径以本文件所在目录为基准，挂载仓库根
      - ../..:/app
      # 匿名卷防止宿主 node_modules 覆盖容器内的
      - /app/node_modules

  # 生产模式：cd apps/server && docker compose --profile prod up -d --build
  server-prod:
    profiles: [prod]
    image: server-prod:v1.0.0
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_BODY: "true"
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    # 不映射宿主端口：只能通过 gateway 访问
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/api/v1/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      disable: false

    # 日志轮转：json-file 默认不轮转会撑爆磁盘，必须显式限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          # gateway nginx.conf 中 proxy_pass http://api:3000 使用该别名
          - api
    volumes:
      - server-logs:/app/logs

volumes:
  server-logs:
    driver: local

# 外部网络：由人显式管理（docker network create react-docker-net），
# 与 gateway、apps/web 共享，不随本项目创建/删除
networks:
  default:
    name: react-docker-net
    external: true




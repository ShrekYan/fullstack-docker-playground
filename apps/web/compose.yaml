name: web

services:
  # 开发模式：cd apps/web && docker compose --profile dev up
  web-dev:
    profiles: [dev]
    build:
      # context 必须是仓库根（pnpm workspace 需要）
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    command: pnpm --filter ./apps/web dev
    ports:
      - "5173:5173"
    environment:
      # Vite proxy 目标：共享网络上的后端服务名（server 项目）
      API_PROXY_TARGET: http://server-dev:3000
    volumes:
      # 相对路径以本文件所在目录为基准，挂载仓库根
      - ../..:/app
      # 匿名卷防止宿主 node_modules 覆盖容器内的
      - /app/node_modules
    # 注意：跨 compose 文件无法 depends_on，Vite proxy 按请求解析目标，后端晚启动无影响

  # 生产模式：cd apps/web && docker compose --profile prod up -d --build
  web-prod:
    profiles: [prod]
    image: ${DOCKER_USER:?need DOCKER_USER in .env}/react-docker-web:${IMAGE_TAG:?need IMAGE_TAG in .env}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # 不映射宿主端口：外部流量统一走 gateway 容器
    restart: unless-stopped
    # 资源限额：CPU 上限（静态文件 + 反代，0.5 核足够）
    cpus: 0.5
    # 资源限额：内存上限，禁 swap，超限快速失败由 restart 拉起
    mem_limit: 128m
    memswap_limit: 128m
    # 容器可写层限额：即使配置失误也不会撑爆宿主机磁盘（需 overlay2 支持）
    # 业界参考：简单 web 容器 ~2G，通用默认 10G；这里持久写入已走 volume/tmpfs，2G 仅兜底意外写入
    storage_opt:
      size: 2G
    # 内存文件系统：nginx 暂存请求体/代理缓存写这里，不占磁盘额度，容器停止即消失
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 日志轮转：json-file 默认不轮转会撑爆磁盘，必须显式限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          # gateway nginx.conf 中 proxy_pass http://webapp:8080 使用该别名
          # 注：不能用 web，Docker 内置 DNS 保留名
          - webapp

# 外部网络：由人显式管理（docker network create react-docker-net），
# 与 gateway、apps/server 共享，不随本项目创建/删除
networks:
  default:
    name: react-docker-net
    external: true

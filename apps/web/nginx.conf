# worker_processes auto; 用于自动分配worker进程数量
worker_processes auto;

# pid /tmp/nginx.pid; 用于指定nginx进程的pid文件路径
pid /tmp/nginx.pid;

# event worker_connections 1024; 用于指定每个worker进程的最大连接数
 events {
      worker_connections 1024;
}

http{
    # include /etc/nginx/mime.types; 用于指定MIME类型文件路径
    include /etc/nginx/mime.types;
    # default_type application/octet-stream; 用于指定默认的MIME类型
    default_type application/octet-stream;
    # access_log off; 刻意关闭访问日志：本容器是内部静态托管层，
    # 所有流量已由 gateway（边缘层）的 JSON access_log 记录，
    # 内层再记属于重复数据；企业做法是只记边缘层
    access_log off;
    
    # Optimization options
    sendfile on;
    # tcp_nopush on; 用于开启Nagle算法
    tcp_nopush on;
    # tcp_nodelay on; 用于开启Nagle算法
    tcp_nodelay on;
    # keepalive_timeout 65; 用于指定长连接超时时间
    keepalive_timeout 65;
    # keepalive_requests 1000; 用于指定每个长连接的最大请求次数
    keepalive_requests 1000;

    # Gzip options
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    # gzip_min_length 256; 用于指定压缩最小文件大小
    gzip_min_length 256;
    # gzip_vary on; 用于开启Vary头，Vary用于指定压缩后的响应是否与原始响应不同
    gzip_vary on;

    server{
        listen 8080;
        server_name localhost;

        # root /usr/share/nginx/html; 用于指定静态文件目录
        root /usr/share/nginx/html;
        # index index.html; 用于指定默认的索引文件
        index index.html;

        # ===== 缓存策略：明确不缓存 =====
        # no-store：浏览器不存任何副本（拆强缓存）
        # etag off：响应不带 ETag（拆 If-None-Match 协商）
        # if_modified_since off：收到 If-Modified-Since 也回 200（拆另一条协商路）
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;

        location / {
            # $uri $uri/ 用于指定请求的URI，$uri/ 用于指定请求的URI和斜杠
            # try_files 用于指定如果请求的URI不存在，尝试返回的文件
            try_files $uri $uri/ /index.html;
        }
    }
}

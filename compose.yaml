name: react-docker
services:
  react-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8080"
    image: docker-reactjs-sample
    ports:
      - "8080:8080"
    # restart: unless-stopped 用于在容器停止后自动重启
    restart: unless-stopped
  
  react-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules


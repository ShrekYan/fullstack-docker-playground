# 网关编排：系统唯一对外入口（8080 前端 + /api、8081 后端直链）
# 启动：cd gateway && docker compose up -d --build

name: gateway

services:
  gateway:
    image: ${DOCKER_USER:?need DOCKER_USER in .env}/react-docker-gateway:${IMAGE_TAG:?need IMAGE_TAG in .env}
    build:
      context: ../
      dockerfile: gateway/Dockerfile
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # 资源限额：CPU 上限（nginx 极低 CPU 即可扛大量请求，0.5 核足够）
    cpus: 0.5
    # 资源限额：内存上限，禁 swap，超限快速失败由 restart 拉起
    mem_limit: 128m
    memswap_limit: 128m
    # 容器可写层限额：即使配置失误也不会撑爆宿主机磁盘（需 overlay2 支持）
    # 业界参考：简单 web 容器 ~2G，通用默认 10G；这里持久写入已走 volume/tmpfs，2G 仅兜底意外写入
    storage_opt:
      size: 2G
    # 内存文件系统：nginx 暂存请求体/代理缓存写这里，不占磁盘额度，容器停止即消失
    tmpfs:
      - /tmp
    # 日志轮转：json-file 默认不轮转会撑爆磁盘，必须显式限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 外部网络：由人显式管理（docker network create react-docker-net），
# 不随本项目的 up/down 创建或删除
networks:
  default:
    name: react-docker-net
    external: true

# 系统级网关 nginx：唯一的流量入口
# - 8080：前端页面 + /api 反代（同源，无 CORS）
# - 8081：后端直链入口
# 上游通过 compose 网络别名解析：web（静态托管）、api（NestJS）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Docker 内置 DNS：配合变量实现上游延迟解析，
    # 上游容器未启动时 nginx 仍能正常启动（请求时返回 502）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上游必须用变量，nginx 才会在请求时解析而非启动时
    map $host $api_upstream {
        default "api:3000";
    }
    map $host $web_upstream {
        default "webapp:8080";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 前端入口：静态资源走 web 容器的 nginx，/api 反代到 server
    server {
        listen 8080;

        location /api {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
        }
    }

    # 后端独立入口：http://localhost:8081 直达 NestJS
    server {
        listen 8081;

        location / {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

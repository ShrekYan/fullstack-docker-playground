# 系统级网关 nginx：唯一的流量入口
# - 8080：前端页面 + /api 反代（同源，无 CORS）
# - 8081：后端直链入口
# 上游通过 compose 网络别名解析：web（静态托管）、api（NestJS）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== 访问日志（企业级做法）=====
    # 1. 结构化 JSON 打到 stdout：docker logs 直接可查，接 Loki/ELK 零改造
    # 2. 静态资源不记录（内层 web 容器流量已被网关记录，避免重复）
    # 3. 4xx/5xx 永远记录（排障刚需），成功请求全量记录（本地流量小）
    # 4. $request_id 贯穿网关与后端，实现链路追踪
    log_format json_log escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    # 条件记录：静态资源（2xx 的 js/css/图片等）跳过，其余全记
    map $uri $loggable {
        ~*\.(ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$  0;
        default                                                    1;
    }

    access_log /dev/stdout json_log if=$loggable;

    # Docker 内置 DNS：配合变量实现上游延迟解析，
    # 上游容器未启动时 nginx 仍能正常启动（请求时返回 502）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上游必须用变量，nginx 才会在请求时解析而非启动时
    map $host $api_upstream {
        default "api:3000";
    }
    map $host $web_upstream {
        default "webapp:8080";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 前端入口：静态资源走 web 容器的 nginx，/api 反代到 server
    server {
        listen 8080;

        location /api {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 链路追踪：网关生成的请求 ID 透传给后端，
            # 后端日志带上它即可与网关访问日志对齐
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
        }
    }

    # 后端独立入口：http://localhost:8081 直达 NestJS
    server {
        listen 8081;

        location / {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}

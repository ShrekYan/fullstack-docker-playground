services:
  web:
    image: nginx:1.28.0-alpine3.21
    container_name: nginx-a1
    ports:
      - "8081:80"
    volumes:
      - ./main.conf:/etc/nginx/nginx.conf
      - ./site:/usr/share/nginx/html
    depends_on:
      - backend1
      - backend2

  backend1:
    image: nginx:1.28.0-alpine3.21
    container_name: nginx-a1-backend1
    volumes:
      - ./backend1.conf:/etc/nginx/conf.d/default.conf

  backend2:
    image: nginx:1.28.0-alpine3.21
    container_name: nginx-a1-backend2
    volumes:
      - ./backend2.conf:/etc/nginx/conf.d/default.conf
     

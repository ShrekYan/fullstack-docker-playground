worker_processes 3;

events {
    worker_connections 1024;
}

http {
    # 包含MIME类型配置文件
    # 用于确定文件的MIME类型，例如text/html、image/jpeg等
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
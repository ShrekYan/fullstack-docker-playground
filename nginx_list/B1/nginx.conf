# worker_processes 是什么？
# worker_processes 是 nginx 工作进程的数量，每个工作进程负责处理客户端请求。
# 默认值是 auto，表示根据 CPU 核心数自动调整。
worker_processes 3;

events {
    # worker_connections 是什么？
    # worker_connections 是每个工作进程可以处理的最大连接数。
    # 默认值是 1024，根据实际需求调整。
    # 跟worker_processes关系？
    # 每个工作进程可以处理的最大连接数，总连接数 = worker_processes * worker_connections。
    worker_connections 1024;
}

http {
    # mime.types是什么？
    # mime.types 是 nginx 配置文件中的一个文件，用于确定文件的MIME类型。
    include mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
server {
    listen 80;
    server_name localhost;

    location = / {
           return 200 "[= /] exact: only URI exactly '/'\n";
    }

    location ^~ /static/ {
         return 200 "[^~ /static/] prefix wins, regex SKIPPED\n";
    }

    location ~* \.(jpg|png)$ {
        return 200 "[~ \\.jpg) regex case-sensitive\n";
    }

    location ~* \.(jpg|png)$ {
        return 200 "[~* \\.(jpg|png)) regex case-insensitive\n";
    }
    
    # ⑤⑤ 普通前缀（无修饰符）
    location /static/logo/ {
        return 200 "[/static/logo/] longest plain prefix\n";
    }

    location / {
        return 200 "[/] fallback plain prefix\n";
    }
}
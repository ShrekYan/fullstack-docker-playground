server {
    listen 80;
    server_name localhost;

    # ① root：URL 前缀与磁盘目录一致，拼接语义
    location /static/ {
        root /data;
    }

    # ② alias：URL 前缀 /imgs/ 映射到磁盘 /data/static/，替换语义
    location /imgs/ {
        alias /data/static/;
    }

    # ③ root 兜底：整个站点挂在 /data 下
    location / {
        root /data;
    }
}
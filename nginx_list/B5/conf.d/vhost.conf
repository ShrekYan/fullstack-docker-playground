# ① 端口虚拟主机：监听 81，与 80 完全隔离
server {
    listen 81;
    server_name _;
    root /data/a;
}

# ② 名字虚拟主机 A
server {
    listen 80;
    server_name a.test;
    root /data/a;
}

# ③ 名字虚拟主机 B
server {
    listen 80;
    server_name b.test;
    root /data/b;
}

# ④ 兜底：既不是 a.test 也不是 b.test 时进来
server {
    listen 80 default_server;
    server_name _;
    root /data;
}

server {
    listen 80;
    server_name localhost;
    
    root /data;

    location /dosc/ {
        alias /data/;
        index index.html home.hml;
    }

    location /app/ {
        alias /data/;
        try_files $uri $uri/ /fallback.html;
    }

    location /spa/ {
        alias /data/;
        try_files $uri /index.html;
    }

    location /strict/ {
        alias /data/;
        error_page 404 /404.html;
    }

    location / {
        return 200 "[root] hit"
    }
}
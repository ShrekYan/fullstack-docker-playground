server {
    listen 80;
    server_name proxy.test;

    location /fwd {
        proxy_pass http://127.0.0.1:8080;
        add_header X-Upstream $upstream_addr always;
    }

    location /nofwd {
        return 200 "upstream_addr=[$upstream_addr] (empty: no proxy happened)\n";
    }
    access_log /var/log/nginx/brief.log brief;
}

server {
    listen 8080;
    server_name _;
    return 200 "BACKEND on 8080 nswered";
}
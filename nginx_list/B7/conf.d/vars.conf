server {
    listen 80;
    server_name localhost;

    location /echo {
        return 200 "uri=[$uri] request_uri=[$request_uri] host=[$host] remote_addr=[$remote_addr] scheme=[$scheme] method=[$request_method]";
    }

    location /app/ {
        try_files $uri /echo;
    }

    access_log /var/log/nginx/brief.log brief;
}
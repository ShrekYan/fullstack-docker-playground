server {
    listen 80;
    server_name localhost;

    # ── return 三连 ──────────────────────────
    location = /moved {
        return 301 /new-home;          # 外部跳转：浏览器要重新发请求
    }

    location = /teapot {
        return 418 "short and stout\n";   # 任意状态码 + 响应体
    }

    # ── rewrite 内部重写 ─────────────────────
    location /old/ {
        # 内部重写：URI 换成 /new/...，重新选 location
        rewrite ^/old/(.*)$ /new/$1 last;
        return 200 "[old] rewrite never reached me\n";   # last 之后这行永远不执行
    }

    location /new/ {
        return 200 "[new] internal rewrite landed here, uri=$uri\n";
    }

    # ── rewrite 外部跳转（对照）───────────────
    location /legacy/ {
        rewrite ^/legacy/(.*)$ /new/$1 permanent;    # 301 外部跳转
    }

    # ── if 安全用法 + 事故复现 ────────────────
    location /method-guard {
        # 安全：if 里只写 return —— 只许 GET
        if ($request_method != GET) {
            return 405;
        }
        return 200 "[method-guard] GET is fine\n";
    }

    location /ua {
        # 安全：if + set 打标记，标记用于别的指令
        set $mobile 0;
        if ($http_user_agent ~* "Mobile") {
            set $mobile 1;
        }
        return 200 "[ua] mobile=$mobile\n";
    }

    # 兜底
    location / {
        return 200 "[root] uri=$uri\n";
    }
}
server {
    listen 80;
    server_name localhost;

    # 实验 A 观察窗
    location /match {
        return 200 "v=[$arg_v] class=[$v_class]\n";
    }

    # 实验 B 观察窗：原文、加工后、毫秒三件套
    location /time {
        return 200 "iso=[$time_iso8601]\nlog_time=[$log_time] log_ms=[$log_ms]\nmsec=[$msec]\n";
    }

    # 实验 E：set 打标记（回收 B8：if 里只 set，不写 return）
    location /setd {
        set $mark "none";
        if ($arg_flag = "1") {
            set $mark "flagged";
        }
        return 200 "mark=[$mark]\n";
    }
}
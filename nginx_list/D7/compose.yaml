services:
  nginx:
    image: nginx:1.28.0-alpine3.21
    container_name: d7-nginx
    ports:
      - "8089:80"
    volumes:
      - ./host-gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./host-gateway/conf.d:/etc/nginx/conf.d
      - ../../apps/web/dist:/usr/share/nginx/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
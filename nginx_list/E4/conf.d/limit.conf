limit_req_zone $binary_remote_addr zone=perip:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        limit_req zone=perip burst=5 nodelay;
    }

    location /queue/ {
        limit_req zone=perip burst=5;
    }
}
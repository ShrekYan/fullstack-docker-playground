worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format timing escape=json
        '{'
        '"time":"$time_iso8601",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"rt":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"urt":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log timing;
    error_log /var/log/nginx/error.log notice;

    server {
        listen 8081;
        access_log off;
        root /usr/share/nginx/html;

        location /slow {
            limit_rate 1k;
            try_files /big.txt =404;
        }
    }

    server {
        listen 80;

        location /api/slow {
            proxy_pass http://127.0.0.1:8081/slow;
        }

        location /api/fast-but-throttled {
            proxy_pass http://127.0.0.1:8081/big.txt;
            limit_rate 1k;
        }

         # ③ 连不上上游：看 upstream_status / urt 怎么记
        location = /api/dead {
            proxy_pass http://127.0.0.1:9;
        }

        location / {
            return 200 "ok\n";
        }
        
    }
}

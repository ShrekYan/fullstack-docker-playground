server {
    listen 8081;
    root /usr/share/nginx/html;
    access_log off;

    location /big {
        limit_rate 1k;
        try_files /big.txt =404;
    }
}

server {
    listen 80;

    location = /version {
        return 200 "1.28.0-alpine3.21\n";
    }

    location = /stream {
        proxy_buffering off;
        proxy_pass http://localhost:8081/big;
        limit_rate 1k;
    }
}
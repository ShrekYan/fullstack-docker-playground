limit_req_zone $binary_remote_addr zone=perip:10m rate=1r/s;

server {
    listen 8081;
    root /usr/share/nginx/html;
    access_log off;

    location /big {
        limit_rate 1k;
        try_files /big.txt =404;
    }

    location /err500 {
        return 500 "Internal Server Error\n";
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location / {
    }

    location /secret/ {
    }

    location /api/dead/ {
        proxy_pass http://127.0.0.1:9;
    }

    location /api/blackhole {
        proxy_connect_timeout 1s;
        proxy_pass http://10.255.255.1:3000/;
    }

    location /api/slow {
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8081/big;
    }

    location /api/half/ {
        proxy_read_timeout 500ms;
        proxy_pass http://127.0.0.1:8081/big;
    }

    # 上游主动 500
    location /api/up500/ {
        proxy_pass http://127.0.0.1:8081/err500;
    }

    # 上传：超过 client_max_body_size → 413
    location /upload/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    location /limited/ {
        limit_req zone=perip burst=1 nodelay;
        limit_req_status 429;
    }
}

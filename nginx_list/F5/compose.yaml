services:
    dir:
        image: nginx:1.28.0-alpine3.21
        container_name: f5-dir
        ports:
            - "8115:80"
        volumes:
            - ./conf-dir:/etc/nginx/conf.d
    file:
        image: nginx:1.28.0-alpine3.21
        container_name: f5-file
        ports:
            - "8116:80"
        volumes:
            - ./file.conf:/etc/nginx/conf.d/default.conf
    api:
        image: nginx:1.28.0-alpine3.21
        container_name: f5-api
    dirvar:
        image: nginx:1.28.0-alpine3.21
        container_name: f5-dirvar
        ports:
            - "8117:80"
        volumes:
            - ./conf-var:/etc/nginx/conf.d

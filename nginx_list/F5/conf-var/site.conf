server {
    listen 80;
    server_name _;

    # Docker 内置 DNS；valid=10s 表示解析结果缓存 10 秒
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /version {
        return 200 "var:v1\n";
    }

    # 变量形式：nginx 不在启动时解析，而是在请求时解析
    location /api/ {
        set $upstream api;
        proxy_pass http://$upstream/;
    }
}
